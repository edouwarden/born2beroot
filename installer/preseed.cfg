### Born2beroot - Debian preseed file
###
### Automated installation of a hardened Debian system with:
###   - LVM on top of encrypted partitions (LUKS)
###   - a dedicated /boot, /, /home, /var, /srv, /tmp and /var/log layout
###   - the `enormand` user, member of the `user42` and `sudo` groups
###
### Adapt the values marked "CHANGE ME" before building the ISO, and make
### sure `mirror/suite` matches the Debian release of the ISO you boot.

### Localization
d-i debian-installer/locale string en_US
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/layoutcode string us
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/hostname string enormand42
d-i netcfg/get_hostname string enormand42
d-i netcfg/get_domain string unassigned-domain

### Packages
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server ufw sudo libpam-pwquality fail2ban
popularity-contest popularity-contest/participate boolean false

### Do not scan additional CDs, use a network mirror instead
apt-cdrom-setup apt-setup/cdrom/set-first boolean false
apt-mirror-setup apt-setup/use_mirror boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/suite string bookworm
d-i mirror/http/proxy string
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates

### Users
d-i passwd/user-fullname string enormand
d-i passwd/username string enormand
### CHANGE ME: replace the passwords below before building the ISO.
d-i passwd/user-password password pass
d-i passwd/user-password-again password pass
d-i passwd/root-password password pass
d-i passwd/root-password-again password pass

### Partitioning: LUKS + LVM
d-i partman/default_filesystem string xfs
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string crypto
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string LVMGroup
d-i partman-auto/choose_recipe select boot-crypto

d-i partman-auto-crypto/erase_disks boolean false
d-i partman-crypto/confirm boolean true
### CHANGE ME: LUKS passphrase.
d-i partman-crypto/passphrase password pass
d-i partman-crypto/passphrase-again password pass
d-i partman-crypto/warn_erase boolean false
d-i partman-crypto/weak_passphrase boolean true

d-i partman-auto/expert_recipe string boot-crypto :: \
	535 535 535 ext4 $primary{ } $bootable{ } \
	method{ format } format{ } \
	use_filesystem{ } filesystem{ ext4 } \
	mountpoint{ /boot } \
	. \
	10700 10700 10700 xfs $lvmok{ } lv_name{ root } \
	in_vg { LVMGroup } method{ format } format{ } \
	use_filesystem{ } filesystem{ xfs } mountpoint{ / } \
	. \
	2461 2461 2461 linux-swap $lvmok{ } lv_name{ swap } \
	in_vg { LVMGroup } method{ swap } format{ } \
	. \
	5350 5350 5350 xfs $lvmok{ } lv_name{ home } \
	in_vg { LVMGroup } method{ format } format{ } \
	use_filesystem{ } filesystem{ xfs } mountpoint{ /home } \
	. \
	3210 3210 3210 xfs $lvmok{ } lv_name{ var } \
	in_vg { LVMGroup } method{ format } format{ } \
	use_filesystem{ } filesystem{ xfs } mountpoint{ /var } \
	. \
	3210 3210 3210 xfs $lvmok{ } lv_name{ srv } \
	in_vg { LVMGroup } method{ format } format{ } \
	use_filesystem{ } filesystem{ xfs } mountpoint{ /srv } \
	. \
	3210 3210 3210 xfs $lvmok{ } lv_name{ tmp } \
	in_vg { LVMGroup } method{ format } format{ } \
	use_filesystem{ } filesystem{ xfs } mountpoint{ /tmp } \
	. \
	4280 4280 4280 xfs $lvmok{ } lv_name{ var-log } \
	in_vg { LVMGroup } method{ format } format{ } \
	use_filesystem{ } filesystem{ xfs } mountpoint{ /var/log } \
	.

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda
d-i finish-install/reboot_in_progress note

### Post-installation hardening
### The two scripts are copied to the new system then executed by
### post_install.sh, which configures SSH, UFW, PAM, sudo, fail2ban and the
### monitoring service.
d-i preseed/late_command string \
	cp /cdrom/preseed.cfg /target/home/enormand/preseed.cfg; \
	cp /cdrom/post_install.sh /target/home/enormand/post_install.sh; \
	cp /cdrom/monitoring.sh /target/home/enormand/monitoring.sh; \
	chmod 0755 /target/home/enormand/post_install.sh /target/home/enormand/monitoring.sh; \
	in-target bash /home/enormand/post_install.sh
